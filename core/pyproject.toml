[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hades-core"
version = "0.1.0"
description = "HADES core - pure trade events, head contract, paper simulator, gate and ladder"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["hades_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
