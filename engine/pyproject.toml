[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hades"
version = "0.1.0"
description = "HADES - Solana memecoin smart-money analytics engine"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2",
    "pydantic-settings>=2",
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[tool.setuptools.packages.find]
include = ["hades*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
